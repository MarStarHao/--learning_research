# 卷积编码器配置

# 数据参数
data_type: 'synthetic'
num_samples: 10000
seq_len: 200
input_dim: 3
pattern_type: 'mixed'

# 模型参数
encoder_type: 'conv'
encoder_dim: 256
encoder_layers: 4
num_timesteps: 1000
schedule_type: 'cosine'

# UNet参数
unet_hidden_dims: [64, 128, 256, 512]
time_emb_dim: 128
use_attention: true

# 训练参数
batch_size: 32
num_epochs: 150
lr: 0.0002
weight_decay: 0.01
use_contrastive: false

# 其他参数
device: 'cuda'
checkpoint_dir: './checkpoints_conv'
log_interval: 50
eval_interval: 500
seed: 42
